# Edge: TLS termination and routing. WAF (ModSecurity + OWASP CRS) and
# HAProxy in front of several API replicas arrive in week 3.

# Docker's DNS; resolving per request lets nginx start even when the API is still booting.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/edge.pem;
    ssl_certificate_key /etc/nginx/certs/edge-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        client_max_body_size 10m;          # matches the API's own limit
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;     # API routes have no /api prefix
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
