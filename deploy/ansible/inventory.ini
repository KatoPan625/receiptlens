# The disposable WSL target made by scripts/new-wsl-target.ps1. For a real VM, replace the
# host line with its address and SSH user; nothing else in the playbook is WSL-specific.
[receiptlens]
rl-target ansible_host=localhost ansible_port=2222 ansible_user=deploy

[receiptlens:vars]
ansible_python_interpreter=/usr/bin/python3
# 443 is already taken on this PC by the Docker Desktop copy of the stack.
published_port=8443
