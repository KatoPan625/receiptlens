# ReceiptLens. Request path: edge (TLS + WAF + rate limit) -> lb (HAProxy) -> api replicas.
# Three networks mirror a cloud VPC layout:
#   edge  - the only network with a published port (443)
#   app   - internal: API tier, no route to the Internet
#   data  - internal: Postgres, RabbitMQ, SeaweedFS (S3), no route to the Internet
# Secrets come from .env (generate with scripts/init-env.ps1, never committed).

name: receiptlens

networks:
  edge: {}
  app:
    internal: true
  data:
    internal: true

volumes:
  pgdata:
  rabbitdata:
  s3data:

services:
  edge:
    # Nginx + ModSecurity v3 + OWASP Core Rule Set, runs as an unprivileged user on 8443.
    image: owasp/modsecurity-crs:4.25.2-nginx-lts
    ports:
      - "443:8443"       # the ONLY published port in the whole stack
    environment:
      MODSEC_RULE_ENGINE: "on"     # block, not just detect
      BLOCKING_PARANOIA: "1"
      # CRS rule 900200: CRS rejects PATCH by default; the API uses it to correct receipts.
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PATCH"
    volumes:
      - ./edge/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./edge/html:/usr/share/nginx/html:ro
      - ./edge/certs:/etc/nginx/certs:ro
    networks: [edge, app]
    mem_limit: 256m
    restart: unless-stopped
    depends_on: [lb]
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://127.0.0.1:8443/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  lb:
    image: haproxy:3.2.9-alpine
    volumes:
      - ./lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [app]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/stats"]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [app]    # internal: no published port; the autoscaler queries it via `docker compose exec`
    mem_limit: 256m
    restart: unless-stopped

  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: receiptlens
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/init-env.ps1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.ps1}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d receiptlens"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.8-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?run scripts/init-env.ps1}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run scripts/init-env.ps1}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    networks: [data]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  migrate:
    # One-shot: schema migration, least-privilege DB role, bucket. Holds the owner/admin
    # credentials so the long-running api never does.
    build: ./api
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap"]
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?run scripts/init-env.ps1}
      S3_KEY: ${S3_ADMIN_KEY}
      S3_SECRET: ${S3_ADMIN_SECRET}
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }
    restart: "no"

  api:
    build: ./api
    scale: 2                   # starting point; scripts/autoscale.py moves it between 1 and 4
    environment:
      DB_USER: api_rw          # SELECT/INSERT/UPDATE on receipts only
      DB_PASSWORD: ${API_DB_PASSWORD}
      S3_KEY: ${S3_API_KEY}    # read/write/list on receipts-raw only
      S3_SECRET: ${S3_API_SECRET}
    networks: [app, data]      # reachable from edge via app; both networks are internal
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }

  storage:
    # SeaweedFS with an S3 API; replaces MinIO (no longer published on Docker Hub).
    image: chrislusf/seaweedfs:4.54
    entrypoint: /bin/sh -c
    # Identities are built from .env at start-up so no key is written into the repo.
    # api: read/write/list on the receipts bucket only. ocr: read-only on it.
    command:
      - |
        cat > /etc/seaweedfs/s3.json <<EOF
        {"identities":[
          {"name":"admin","credentials":[{"accessKey":"${S3_ADMIN_KEY:?run scripts/init-env.ps1}","secretKey":"${S3_ADMIN_SECRET:?run scripts/init-env.ps1}"}],"actions":["Admin","Read","Write","List","Tagging"]},
          {"name":"api","credentials":[{"accessKey":"${S3_API_KEY:?}","secretKey":"${S3_API_SECRET:?}"}],"actions":["Read:receipts-raw","Write:receipts-raw","List:receipts-raw"]},
          {"name":"ocr","credentials":[{"accessKey":"${S3_OCR_KEY:?}","secretKey":"${S3_OCR_SECRET:?}"}],"actions":["Read:receipts-raw"]}
        ]}
        EOF
        exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3data:/data
    networks: [data]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 15s
      timeout: 5s
      retries: 5
