line-length = 130
target-version = "py313"

[lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, bandit (security)
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is how pytest tests work
    "S104",  # binding 0.0.0.0 is intended inside containers
]

[lint.isort]
known-first-party = ["app", "receipt_parser", "worker", "autoscale"]

[lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108"]  # fixture secrets / tmp paths in tests
