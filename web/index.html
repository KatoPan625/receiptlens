<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReceiptLens</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <span class="mark">ReceiptLens</span>
    <nav><a href="/api/docs">API</a><a href="/grafana/">Monitoring</a></nav>
  </header>

  <main>
    <section class="upload" aria-labelledby="up-h">
      <h1 id="up-h">Add a receipt</h1>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp" capture="environment">
        <span>Drop a photo here, or <u>choose a file</u></span>
        <small>JPEG, PNG or WebP · up to 10 MB</small>
      </label>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="stats-h">
      <h2 id="stats-h">Spending by month</h2>
      <div id="stats" class="bars"><p class="empty">No totals yet.</p></div>
    </section>

    <section aria-labelledby="list-h">
      <h2 id="list-h">Receipts</h2>
      <table>
        <thead><tr><th>Date</th><th>Merchant</th><th class="num">Total</th><th>Status</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
    </section>
  </main>

  <dialog id="detail" aria-labelledby="d-h">
    <form method="dialog" class="close"><button aria-label="Close">×</button></form>
    <h2 id="d-h">Receipt</h2>
    <div class="detail">
      <img id="d-img" alt="Receipt photo">
      <div>
        <form id="edit">
          <label>Merchant <input name="merchant" maxlength="200"></label>
          <label>Total (VND) <input name="total_vnd" type="number" min="0" step="1"></label>
          <label>Date <input name="purchased_at" type="datetime-local"></label>
          <button type="submit">Save correction</button>
          <p class="msg" id="d-msg" role="status" aria-live="polite"></p>
        </form>
        <details><summary>OCR text</summary><pre id="d-raw"></pre></details>
      </div>
    </div>
  </dialog>
</body>
</html>
