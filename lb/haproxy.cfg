# HAProxy: load balancer in front of the API replicas (the "Cloud Load Balancing" role).
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 3s
    timeout client  30s
    timeout server  30s
    retries 2
    option redispatch          # retry another replica if the chosen one fails

# Docker's embedded DNS returns one A record per `api` replica.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
    accepted_payload_size 8192

frontend api_in
    bind :8080
    default_backend api

backend api
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    default-server inter 3s fall 2 rise 2
    # Up to 4 slots, filled from DNS as replicas come and go (autoscaler).
    server-template api 4 api:8000 check resolvers docker init-addr none

# Internal only (app network): Prometheus metrics and the stats page.
frontend monitor
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
